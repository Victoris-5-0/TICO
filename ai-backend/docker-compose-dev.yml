# Local development.
#
#   docker compose -f docker-compose-dev.yml up --build
#
# Talks to the same Supabase project as everything else — there is no local Postgres
# here on purpose. The schema is owned by Prisma from client/, so a second database
# would immediately be a third version of the truth.

services:
  ai-backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ENVIRONMENT: development
      # Accept unauthenticated requests and serve them as the demo student, so the client
      # team can drive the API locally without minting a Better Auth session first.
      #
      # This used to blank SUPABASE_URL and JWT_SECRET, which is what dev mode keyed off
      # when auth was Supabase JWTs. Auth is Better Auth now — `app/core/auth.py` looks a
      # session token up in the shared database — so those two lines had stopped doing
      # anything and every local call 401'd with no obvious cause. `ALLOW_DEMO_AUTH`
      # defaults to false, and this is the only thing that turns it on.
      #
      # Ignored when ENVIRONMENT=production, so it cannot ship by accident.
      ALLOW_DEMO_AUTH: "true"
      # One worker with --reload: code changes restart the server, and a single worker
      # keeps per-process state coherent.
      WEB_CONCURRENCY: 1
    volumes:
      # Live-reload the source. `content/` too, so editing a world manifest does not
      # need a rebuild.
      - ./app:/app/app:ro
      - ./content:/app/content:ro
    command: >
      uvicorn app.main:app
      --host 0.0.0.0 --port 8000 --reload
      --reload-dir /app/app --reload-dir /app/content
    restart: unless-stopped
