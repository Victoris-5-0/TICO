[pytest]
testpaths = tests

markers =
    slow: calls a real model. Costs money and takes 20-30 seconds; deselect with -m "not slow".

# Everything below is a warning we have read and decided about. Anything new shows up
# loud, which is the point — a warnings list that scrolls past is a list nobody reads.
filterwarnings =
    default
    ignore:The `anyio.abc.BlockingPortal` alias is deprecated:DeprecationWarning
    ignore:The default value of `allowed_objects` will change:UserWarning
