# Nginx reverse proxy for the TICO AI backend.
#
#   sudo cp nginx/tico-ai.conf /etc/nginx/sites-available/tico-ai
#   sudo ln -s /etc/nginx/sites-available/tico-ai /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then let certbot add TLS:
#   sudo certbot --nginx -d api.yourdomain.com
#
# Certbot rewrites this file to add the 443 block and a 301 from 80. Do not hand-write
# the TLS block; let it manage the certificate paths and the renewal cron.

# Rate limit by client IP. Every request here costs a Gemini call or a database query,
# and the free tier has a hard daily quota — one loop in client code could burn the whole
# day's budget before anyone notices.
limit_req_zone $binary_remote_addr zone=tico_api:10m rate=10r/s;

upstream tico_ai {
    # Matches the 127.0.0.1 bind in docker-compose-prod.yml.
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;   # replace with api.yourdomain.com before running certbot

    # Never advertise the exact nginx version.
    server_tokens off;

    # The client sends a JSON body with the student's code in it; 1m is generous.
    client_max_body_size 1m;

    # Student code and Arabic hints are both UTF-8. Getting this wrong renders Arabic
    # as mojibake in the browser while every test still passes.
    charset utf-8;

    access_log /var/log/nginx/tico-ai.access.log;
    error_log  /var/log/nginx/tico-ai.error.log;

    # ---------------------------------------------------------------------------
    # SSE: TICO's chat streams token by token.
    #
    # This block MUST come before the general / block — nginx matches the longest
    # prefix, so it wins for this path. Without it, proxy_buffering holds the whole
    # stream and delivers it in one lump at the end, which is the same as not
    # streaming at all and looks like the model being slow.
    # ---------------------------------------------------------------------------
    location /v1/tico/messages {
        proxy_pass http://tico_ai;
        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        # Some proxies buffer regardless; this is the explicit opt-out they respect.
        proxy_set_header X-Accel-Buffering no;

        # A student can sit thinking mid-conversation. Do not cut them off.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header Connection "";
    }

    # ---------------------------------------------------------------------------
    # Everything else.
    # ---------------------------------------------------------------------------
    location / {
        limit_req zone=tico_api burst=20 nodelay;

        proxy_pass http://tico_ai;
        proxy_http_version 1.1;

        # Mission generation can legitimately take 20-30s. Below gunicorn's 120s
        # timeout so the app decides its own fate rather than nginx guessing.
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pass the client's request id through so one trace spans Vercel and here.
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header Connection "";
    }

    # Uptime checks should not be rate limited or logged.
    location = /v1/health {
        proxy_pass http://tico_ai;
        proxy_set_header Host $host;
        access_log off;
    }
}
