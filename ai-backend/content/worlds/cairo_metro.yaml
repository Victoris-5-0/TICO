# =============================================================================
# WORLD MANIFEST — Cairo Metro
#
# This file is the CLOSED SET of everything a mission in this world may use.
# If it is not written here, mission generation may not put it in a mission.
# Generation is SELECTION from this inventory, never invention.
#
# It is read twice per generated mission:
#   1. to COMPOSE  — the model picks a scene, props and parameters from these lists
#   2. to VALIDATE — a Python function re-reads this file and rejects any mission
#                    referencing an id or verb that is not here
#
# The `verbs` and `reads` under each prop are the REAL Python API the student
# writes against. They come from the game engine developer, not from design.
# If generation invents gate.unlock() and the engine implements gate.open(),
# the mission is unsolvable — the validator exists to catch exactly that.
# =============================================================================

world:
  id: cairo_metro
  name_en: Cairo Metro
  name_ar: مترو القاهرة
  order: 1                      # chapter position in the fixed roadmap

  # Links this file to the database. Must match tracks.environment_key exactly.
  track_slug: cairo-metro
  environment_key: cairo_metro

  # The character TICO plays here. Goes to tracks.mentor_persona.
  mentor_persona: metro_operator

# -----------------------------------------------------------------------------
# SCENES — backdrops that exist as artwork.
# Generation picks one per mission. It may not describe a place with no id here.
# The chosen id is stored on generated_missions.scene_id.
# -----------------------------------------------------------------------------
scenes:
  - id: platform_day
    asset: metro/platform_day.png
    description_en: Busy platform, a train approaching
    description_ar: رصيف مزدحم والقطار قادم
    supports: [gate, passenger_counter, announcement_board]

  - id: ticket_hall
    asset: metro/ticket_hall.png
    description_en: Ticket machines and turnstiles, a queue building
    supports: [ticket_machine, gate, passenger_counter]

  - id: control_room
    asset: metro/control_room.png
    description_en: Operator desk with screens
    supports: [announcement_board, train_schedule]

# -----------------------------------------------------------------------------
# CHARACTERS — who may appear and speak. TICO is always available in every world.
# `beats` are the moments a character can have a line generated for.
# -----------------------------------------------------------------------------
characters:
  - id: tico
    role: mentor
    asset: tico/tico_idle.png
    voice: warm, playful, encouraging; never sarcastic, never condescending
    language: Egyptian Arabic for dialogue, English for code identifiers
    beats: [greeting, nudge, success, failure, celebrate]

  - id: station_officer
    role: npc
    asset: metro/officer.png
    voice: brisk, practical, a little tired
    beats: [problem_intro, reaction]

# -----------------------------------------------------------------------------
# PROPS — THE MOST IMPORTANT SECTION.
#
# `verbs`  — functions the student's code may CALL
# `reads`  — properties the student's code may READ
#
# These two lists ARE the game API. Nothing else may appear in generated
# starter code, solutions or tests. Owned by the game engine developer.
# -----------------------------------------------------------------------------
props:
  - id: gate
    asset: metro/gate.png
    states: [open, closed]
    verbs:
      - "gate.open()"
      - "gate.close()"

  - id: passenger_counter
    asset: metro/counter.png
    reads:
      - "station.passengers -> int"

  - id: announcement_board
    asset: metro/board.png
    verbs:
      - "board.show(text)"

  - id: train_schedule
    reads:
      - "train.delay_minutes -> int"
      - "train.is_arriving -> bool"

  - id: ticket_machine
    asset: metro/ticket_machine.png
    reads:
      - "passenger.age -> int"
    verbs:
      - "machine.set_price(value)"

# -----------------------------------------------------------------------------
# MECHANICS — authored templates. Each becomes one mission_templates row.
# Generation fills `param_schema`; it never invents a new mechanic and never
# changes target_concept.
#
#   mechanics[].id               -> mission_templates.mechanic_id
#   mechanics[].target_concept   -> mission_templates.target_concept_id
#   mechanics[].carried_concepts -> mission_templates.carried_concept_ids
#   mechanics[].param_schema     -> mission_templates.param_schema
# -----------------------------------------------------------------------------
mechanics:
  - id: variable_price
    target_concept: variables            # must match concepts.slug
    carried_concepts: []
    scenes: [ticket_hall]
    props_required: [ticket_machine]
    difficulty_band: 2
    goal_shape: >
      Store a value in a variable and use it to set the ticket price.
    param_schema:
      base_price: { type: int, min: 5, max: 20 }
    starter_template: |
      # {brief}
      # TODO: store the price in a variable, then set it on the machine
    solution_template: |
      price = {base_price}
      machine.set_price(price)
    tests:
      - name: price is set correctly
        call: "machine.price"
        expected: "{base_price}"

  - id: conditional_gate
    target_concept: conditionals
    carried_concepts: [variables]
    scenes: [platform_day, ticket_hall]
    props_required: [gate, passenger_counter]
    difficulty_band: 4
    goal_shape: >
      Open the gate only when a numeric reading crosses a threshold.
    param_schema:
      reading:    { type: enum, options: ["station.passengers", "train.delay_minutes"] }
      threshold:  { type: int, min: 3, max: 50 }
      comparison: { type: enum, options: [">", "<", ">=", "<="] }
    starter_template: |
      # {brief}
      {carried_scaffold}
      # TODO: open the gate when the condition is true
    solution_template: |
      waiting = {reading}
      if waiting {comparison} {threshold}:
          gate.open()
    tests:
      - name: gate opens above the threshold
        setup: "{reading} = {threshold} + 1"
        call: "gate.state"
        expected: "open"
      - name: gate stays shut below the threshold
        setup: "{reading} = {threshold} - 1"
        call: "gate.state"
        expected: "closed"

# -----------------------------------------------------------------------------
# CARRIED SCAFFOLD — how a carried concept is pre-filled when the composer says
# a student is strong on it. Substituted into {carried_scaffold} above.
# ScaffoldLevel NONE means the placeholder is replaced with nothing at all.
# -----------------------------------------------------------------------------
carried_scaffold:
  variables:
    FULL:    "waiting = station.passengers   # already done for you"
    PARTIAL: "waiting =   # fill in the reading"
    NONE:    ""

# -----------------------------------------------------------------------------
# GUARDRAILS — asserted by a Python validator, never trusted to the model.
# -----------------------------------------------------------------------------
constraints:
  may_vary:
    - scene
    - params
    - brief_wording
    - npc_lines
    - carried_scaffold
  may_not_vary:
    - world
    - target_concept
    - mechanic
    - prop_verbs
    - solution_shape
  locale: ar-EG
  reading_age: 10-17
  max_starter_lines: 12
