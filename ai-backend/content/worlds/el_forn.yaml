# =============================================================================
# WORLD MANIFEST — El Forn (البلدي bakery)
#
# The CLOSED SET of everything a generated mission in this world may use.
# If it is not written here, generation may not put it in a mission.
# Generation is SELECTION from this inventory, never invention.
#
# Read twice per generated mission:
#   1. to COMPOSE  — the model picks a scene, a mechanic and parameters from these lists
#   2. to VALIDATE — a Python function re-reads this file and rejects any mission whose
#                    function signature, scene or vocabulary is not here
#
# -----------------------------------------------------------------------------
# NOTE ON SHAPE — this manifest was rewritten on 7 September 2026.
#
# The first version modelled a game API: props with `verbs` like `gate.open()` and
# `reads` like `station.passengers`, as if the student were driving a simulation.
# That is not what got built. The exercises in `client/prisma/seed.ts` are plain Python
# functions with a signature and a return value, executed by Pyodide in the browser:
#
#     def opening_notice(station_name: str, loaves: int) -> str
#
# So the closed set is no longer props and verbs. It is **function signatures** plus the
# world's **vocabulary**. A generated mission must ask for one of the signatures below,
# and may only dress it in the nouns listed under `vocabulary`.
# =============================================================================

world:
  id: el_forn
  name_en: "El Forn: Baladi Bakery"
  name_ar: الفرن البلدي
  order: 1                       # first chapter in the fixed roadmap

  # Links this file to the database. Must match tracks.slug exactly.
  track_slug: el-forn

  # The character TICO plays here. Warm, floury, up before dawn.
  mentor_persona: baker

  # One line of orientation the generator may draw on for a brief. Not a prompt.
  premise_ar: >
    فرن بلدي في حي شعبي. الصواني بتطلع من الفرن من قبل الفجر، والزباين بيستنوا
    على الرصيف. كل حاجة في الفرن بتتعد: الصواني، الأرغفة، الطلبات.

# -----------------------------------------------------------------------------
# SCENES — backdrops that exist as artwork under client/public/assets/bakery-v2.
# Generation picks one per mission and stores it on generated_missions.scene_id.
# It may not describe a place with no id here.
# -----------------------------------------------------------------------------
scenes:
  - id: bakery_establishing
    asset: worlds/bakery/establishing-v1.webp
    description_en: The bakery from the street at dawn, awning out, oven glowing
    description_ar: الفرن من الشارع بدري، التندة نازلة والفرن نوّر
    supports_vocabulary: [loaves, trays, opening_time, customers]

  - id: bakery_gameplay
    asset: worlds/bakery/gameplay/playfield-topdown-v1.webp
    description_en: Behind the counter — worktop, peel, trays going into the oven
    description_ar: ورا التسليم — الطبلية والمدرة والصواني داخلة الفرن
    supports_vocabulary: [loaves, trays, loaves_per_tray, dough, oven_temperature, orders]
# -----------------------------------------------------------------------------
# CHARACTERS — everyone the bakery-v2 scene can draw.
#
# Eleven, of which ten have sprite atlases. Only Hassan and Salma have a role beyond
# queueing; the other eight are the queue, and the queue is eight long.
#
# Two of these used to be wrong. The manifest had Mariam running the counter and the
# orders book, and the demo draws her waiting in the queue; it had Salma "learning the
# trade", and she is the queue coordinator, the one person in the scene facing the other
# way. A line addressed to a Mariam behind the counter would be spoken to someone the
# child can see standing in the line.
#
# The `#` line under each is their appearance, read out of the artwork prompts. A
# generated line describing someone must not contradict it.
#
# The eight customers used to share one description — "In the queue. Takes two loaves
# and walks off." — and the result was that seven missions out of seven opened with
# Hassan. A model given eight interchangeable names picks the one with a personality.
# These are one line each so it has something to choose between.
# -----------------------------------------------------------------------------
characters:

  - id: tico
    name_ar: تيكو
    role: mentor
    asset: characters/tico/tico-neutral.webp
    description: The companion. Explains, never solves.
    voice: warm, playful, encouraging; never sarcastic, never condescending
    beats: [greeting, nudge, success, failure, celebrate]

  - id: hassan
    name_ar: حسن
    role: npc
    asset: bakery-v2/hassan.webp
    description: The baker. Works the oven and the peel, and hands the bread over himself.
    # Moustache, short salt-and-pepper hair, medium-brown skin, cream rolled-sleeve shirt, terracotta apron, dark trousers. Middle-aged.
    voice: gruff, kind underneath, short practical sentences
    beats: [problem_intro, reaction]

  - id: salma
    name_ar: سلمى
    role: npc
    asset: bakery-v2/salma.webp
    description: Queue coordinator. Faces the queue and waves the next customer forward. Never queues, never served.
    # Medium-brown skin, teal hijab, coral long modest tunic, dark trousers, brown shoes. Carries a small blank clipboard.
    voice: calm, organised, keeps the line moving
    beats: [problem_intro, reaction]

  - id: mariam
    name_ar: مريم
    role: customer
    asset: bakery-v2/mariam.webp
    description: A regular. Buys for the whole family, so she is always counting.
    # Adult woman. Sand hijab, medium-brown skin, teal patterned dress, brown shoes.
    voice: ordinary, unhurried; a neighbour buying bread, not a character in a lesson
    beats: [reaction]

  - id: nour
    name_ar: نور
    role: customer
    asset: bakery-v2/nour.webp
    description: Young, quick, in a hurry. Asks whether the maths could be faster.
    # Young adult man. Curly dark hair, teal open overshirt over a cream T-shirt, navy trousers, brown sneakers, small terracotta backpack.
    voice: ordinary, unhurried; a neighbour buying bread, not a character in a lesson
    beats: [reaction]

  - id: amina
    name_ar: أمينة
    role: customer
    asset: bakery-v2/amina.webp
    description: In her sixties, unhurried, dignified. Has bought bread here for forty years.
    # Woman in her sixties. Cream hijab, olive-green long loose dress, plain brown shoes. Kind, dignified.
    voice: ordinary, unhurried; a neighbour buying bread, not a character in a lesson
    beats: [reaction]

  - id: omar
    name_ar: عمر
    role: customer
    asset: bakery-v2/omar.webp
    description: A workman on his break. Wants a straight answer and no fuss.
    # Man in his thirties, stocky. Dusty-blue long-sleeve workshirt with rolled cuffs, ochre-tan trousers, dark brown shoes.
    voice: ordinary, unhurried; a neighbour buying bread, not a character in a lesson
    beats: [reaction]

  - id: dina
    name_ar: دينا
    role: customer
    asset: bakery-v2/dina.webp
    description: A university student. Curious about how the shop keeps its numbers straight.
    # University student in her twenties. Dark curly hair in a low ponytail, no headscarf, rust-terracotta blouse, navy trousers, cream sneakers.
    voice: ordinary, unhurried; a neighbour buying bread, not a character in a lesson
    beats: [reaction]

  - id: youssef
    name_ar: يوسف
    role: customer
    asset: bakery-v2/youssef.webp
    description: Late sixties, glasses, precise. Notices when a count is wrong.
    # Dignified man in his late sixties. White hair and moustache, small round eyeglasses, light-taupe galabeya, brown slippers.
    voice: ordinary, unhurried; a neighbour buying bread, not a character in a lesson
    beats: [reaction]

  - id: hoda
    name_ar: هدى
    role: customer
    asset: bakery-v2/hoda.webp
    description: Buying for a household of six. Orders in multiples and expects them to add up.
    # Woman in her forties. Charcoal-black hijab, mustard-ochre knee-length tunic, dark-teal trousers, black flats.
    voice: ordinary, unhurried; a neighbour buying bread, not a character in a lesson
    beats: [reaction]

  - id: farid
    name_ar: فريد
    role: customer
    asset: bakery-v2/farid-saidi.webp
    description: Sa'idi, in a galabeya. Warm, talkative, tells you the total before you work it out.
    # Man in his fifties, Sa'idi. Galabeya and turban. Balding with a thick black moustache, tan-brown skin.
    voice: ordinary, unhurried; a neighbour buying bread, not a character in a lesson
    beats: [reaction]


vocabulary:
  loaves:
    en: loaves of baladi bread
    ar: أرغفة
    type: int
    plausible_range: [10, 500]

  trays:
    en: baking trays
    ar: صواني
    type: int
    plausible_range: [1, 40]

  loaves_per_tray:
    en: loaves that fit on one tray
    ar: عدد الأرغفة في الصينية
    type: int
    plausible_range: [8, 30]

  customers:
    en: people waiting at the counter
    ar: زباين
    type: int
    plausible_range: [1, 60]

  orders:
    en: a list of orders taken
    ar: طلبات
    type: list

  price:
    en: price per loaf, in piastres
    ar: سعر الرغيف بالقرش
    type: int
    plausible_range: [5, 150]

  flour_sacks:
    en: sacks of flour delivered
    ar: شكاير دقيق
    type: int
    plausible_range: [1, 50]

  station_name:
    en: the branch or neighbourhood name
    ar: اسم الفرع أو الحي
    type: str
    # Real Cairo neighbourhoods only. A generated mission set in an invented
    # district reads as fake to the exact children this is for.
    options: [الفرن البلدي, السيدة زينب, شبرا, المعادي, الدقي, إمبابة, حلوان]

  opening_time:
    en: the hour the bakery opens
    ar: ميعاد الفتح
    type: int
    plausible_range: [4, 9]

  dough:
    en: batches of dough resting
    ar: عجين
    type: int
    plausible_range: [1, 20]

  oven_temperature:
    en: oven temperature in celsius
    ar: حرارة الفرن
    type: int
    plausible_range: [180, 350]

  weight_per_sack:
    en: weight of one flour sack, in kilos
    ar: وزن الشكارة بالكيلو
    type: int
    plausible_range: [10, 50]
# -----------------------------------------------------------------------------
# VISUAL — the closed vocabulary the client can draw and move.
#
# The second fence. A mission asking for artwork nobody drew renders as a dead screen
# while its code still looks perfectly correct, which is exactly the kind of failure
# nothing else catches.
#
# `sprites` map to files under client/public/assets/bakery-v2/.
# -----------------------------------------------------------------------------
visual:
  # bakery-v2 is the renderer. The old top-down still is not what the client draws: the
  # mission route composes an SVG scene from the bakery-v2 layers, seen side-on.
  backdrop: bakery-v2/environment.webp
  establishing: worlds/bakery/establishing-v1.webp

  # `max_shown` is what the scene will actually draw, not a style preference. The tray
  # has eight slots; a mission that puts nine loaves on it loses one with no error.
  sprites:
    environment: { asset: bakery-v2/environment.webp }
    awning:      { asset: bakery-v2/awning.webp }
    oven:        { asset: bakery-v2/oven.webp,       states: [cold, lit] }
    oven-fire:   { asset: bakery-v2/oven-fire.webp }
    counter:     { asset: bakery-v2/counter.webp }
    worktop:     { asset: bakery-v2/worktop.webp }
    tray:        { asset: bakery-v2/tray.webp }
    peel:        { asset: bakery-v2/peel.webp }
    olive:       { asset: bakery-v2/olive.webp }
    aloe:        { asset: bakery-v2/aloe.webp }
    radio:       { asset: bakery-v2/radio.webp }
    flour-sack:  { asset: bakery-v2/flour-sack.webp }
    loaf:        { asset: bakery-v2/loaf.webp,       countable: true, max_shown: 8 }
    dough:       { asset: bakery-v2/dough.webp,      countable: true, max_shown: 8 }
    bag:         { asset: bakery-v2/bag.webp,        countable: true, max_shown: 1 }
  states:
    oven: [cold, lit]

  # The phases the bakery-v2 state machine actually runs, in order, plus its three
  # continuous loops. These replaced four names that read well and rendered nothing:
  # `trays_into_oven`, `loaves_appear`, `count_up` and `tray_burns` were never
  # implemented, and `tray_burns` has no artwork in bakery-v2 at all — which is why the
  # burnt-tray state is gone from `states` above.
  animations:
    - loading             # Hassan slides the dough into the oven on the peel (1800ms)
    - baking              # the oven works; dough becomes bread 60% through (2800ms)
    - retrieving          # he draws the hot bread out on the peel (1800ms)
    - stocking            # loaves move from the peel onto the tray (1400ms)
    - handover            # two loaves pass to the customer's hands (2000ms)
    - exiting             # the served customer walks off frame left (2200ms)
    - advancing           # the whole queue steps one place forward (1400ms)
    - walk_cycle          # continuous, 180ms a frame
    - oven_fire           # continuous, brightens while baking
    - steam               # continuous, above the oven and above the counter


# -----------------------------------------------------------------------------
# SIMULATION — the scene's own arithmetic, and the verbs it offers.
#
# `visual` above says what can be DRAWN. This says what is TRUE about it once drawn,
# which is a different constraint and the one that was missing.
#
# These are not suggestions. `client/src/lib/bakery/simulation.ts` bakes eight loaves a
# batch and hands two to each customer, and the sprites are placed to match. A mission
# teaching `loaves_per_tray = 12` is perfectly good Python — it runs, it passes its
# tests, the validator is satisfied — and the child still watches eight loaves land on
# the tray while being told there are twelve. Nothing else in the pipeline catches it,
# because every part of it is individually correct.
# -----------------------------------------------------------------------------
simulation:
  quantities:
    batch_size: 8
    order_size: 2
    queue_length: 8
    batches_to_clear_queue: 2
    loaves_to_clear_queue: 16
    tray_capacity: 8

  # A mission expecting any other verb has no button to press.
  controls:
    - { id: bake, label_en: Bake batch, label_ar: اخبز دفعة, effect: "adds 8 loaves as dough" }
    - { id: serve, label_en: Serve next, label_ar: قدّم للي عليه الدور, effect: "gives 2 loaves to the head of the queue" }
    - { id: demo, label_en: Play demo, label_ar: شغّل العرض, effect: "runs the full cycle unattended" }
    - { id: pause, label_en: Pause, label_ar: وقّف مؤقتًا, effect: "freezes the clock mid-phase" }
    - { id: reset, label_en: Reset, label_ar: ابدأ من جديد, effect: "back to 8 waiting, 0 baked" }

  rules:
    - A bake is refused while the tray still holds bread.
    - A serve is refused below two loaves.
    - Two full batches clear the queue exactly. Sixteen loaves, eight customers.

# -----------------------------------------------------------------------------
# CONCEPT NOTES — what phase 3 says on the SECOND and THIRD mission of a concept.
#
# A concept is introduced once. The first mission's explanation is generated, because an
# introduction should suit the scenario it arrives in. The next two are written here.
#
# They are authored rather than generated because generation would not stop defining the
# concept. Told it was mission 2 of 3, given the previous explanation verbatim, and
# instructed in both English and Arabic not to repeat it, the model produced "a variable
# is like a box you put a value in" three times running — four different prompt shapes,
# same result. The prior is stronger than the instruction, so the instruction was dropped.
#
# Keyed by concept slug, then by which mission of the three. Missing entries fall back to
# whatever the model wrote, so adding a concept does not break generation.
# -----------------------------------------------------------------------------
concept_notes:
  variables:
    2: >
      الاسم هو اللي بيفرق. لما تسمي المتغير loaves_per_tray، الكود بيقول لوحده هو بيعمل
      إيه. ولو الرقم اتغير بكرة، بتغيره في مكان واحد بس والباقي كله بيمشي معاه.
    3: >
      خد بالك: المتغير بيفضل شايل آخر قيمة حطيتها فيه. لو كتبت اسمه قبل ما تديله قيمة،
      بايثون هيقف ويقولك إنه مش عارفه. الترتيب مهم.

  conditionals:
    2: >
      الشرط بيتنفذ لو الجواب أيوه بس. الجزء اللي جوه الـ if مش بيشتغل كل مرة — بيشتغل لما
      الشرط يتحقق، والباقي بيعدي عليه عادي.
    3: >
      أشهر غلطة: علامة تساوي واحدة بدل اتنين. الـ = بتخزن قيمة، والـ == بتقارن. لو كتبت
      واحدة مكان التانية بايثون هيقولك في غلطة، والسطر مش هيشتغل أصلاً.

  loops:
    2: >
      اللوب بيوفر عليك التكرار. بدل ما تكتب نفس السطر لكل صينية، بتكتبه مرة واحدة وبايثون
      بيعيده على كل واحدة لوحده — وده بيشتغل سواء كانوا تلاتة أو تلاتين.
    3: >
      المتغير اللي بتجمع فيه لازم يبدأ من صفر قبل اللوب، مش جواه. لو بدأته جوه، بيرجع صفر
      مع كل لفة والمجموع بيضيع.

# -----------------------------------------------------------------------------
# MECHANICS — authored templates. Each becomes one mission_templates row.
# Generation fills `param_schema`; it never invents a mechanic, never changes
# `target_concept`, and never alters the function signature.
#
#   mechanics[].id               -> mission_templates.mechanic_id
#   mechanics[].target_concept   -> mission_templates.target_concept_id (concepts.slug)
#   mechanics[].carried_concepts -> mission_templates.carried_concept_ids
#   mechanics[].param_schema     -> mission_templates.param_schema
#
# `signature` is the contract with Pyodide. The tests call exactly this name with
# exactly these types, so a generated mission that renames the function produces
# tests that cannot pass.
# -----------------------------------------------------------------------------
mechanics:
  - id: compose_notice
    target_concept: variables
    carried_concepts: []
    scenes: [bakery_establishing, bakery_gameplay]
    difficulty_band: 2
    signature: "<<fn_name>>(<<a_name>>: str, <<b_name>>: int) -> str"
    # Modelled on exercise-forn-01, which already exists and works.
    goal_shape: >
      Build one sentence out of a string and a number and return it.
    vocabulary_used: [station_name, loaves]
    param_schema:
      fn_name:  { type: enum, options: [opening_notice, ready_message, morning_notice] }
      a_name:   { type: const, value: station_name }
      b_name:   { type: enum, options: [loaves, trays, customers] }
      opener:  { type: enum, options: [مخبز, فرن] }
    starter_template: |
      def <<fn_name>>(<<a_name>>: str, <<b_name>>: int) -> str:
          # <<brief_ar>>
          pass
    solution_template: |
      def <<fn_name>>(<<a_name>>: str, <<b_name>>: int) -> str:
          return f"<<opener>> {<<a_name>>} جاهز بـ {<<b_name>>} رغيف"
    tests:
      - input: '<<fn_name>>("<<sample_destination>>", <<sample_b>>)'
        expected: '"<<expected_sentence>>"'
      - input: '<<fn_name>>("<<sample_place2>>", <<sample_b2>>)'
        expected: '"<<expected_sentence_2>>"'

  - id: multiply_quantities
    target_concept: variables
    carried_concepts: []
    scenes: [bakery_establishing, bakery_gameplay]
    difficulty_band: 2
    signature: "<<fn_name>>(<<a_name>>: int, <<b_name>>: int) -> int"
    # Modelled on exercise-forn-02.
    goal_shape: >
      Multiply two counted quantities and return the total.
    vocabulary_used: [trays, loaves_per_tray, flour_sacks]
    param_schema:
      fn_name: { type: enum, options: [calculate_loaves, total_loaves, count_output] }
      a_name:  { type: enum, options: [trays, sacks] }
      b_name:  { type: enum, options: [loaves_per_tray, weight_per_sack] }
    starter_template: |
      def <<fn_name>>(<<a_name>>: int, <<b_name>>: int) -> int:
          # <<brief_ar>>
          pass
    solution_template: |
      def <<fn_name>>(<<a_name>>: int, <<b_name>>: int) -> int:
          return <<a_name>> * <<b_name>>
    tests:
      - input: "<<fn_name>>(<<sample_a>>, <<sample_b>>)"
        expected: "<<product>>"
      - input: "<<fn_name>>(0, <<sample_b>>)"
        expected: "0"

  - id: threshold_decision
    target_concept: conditionals
    carried_concepts: [variables]
    scenes: [bakery_establishing, bakery_gameplay]
    difficulty_band: 4
    signature: "<<fn_name>>(<<a_name>>: int, <<b_name>>: int) -> str"
    goal_shape: >
      Return one of two messages depending on whether a count crosses a threshold.
    vocabulary_used: [loaves, customers, trays]
    param_schema:
      fn_name:    { type: enum, options: [bake_more, should_bake, check_stock] }
      a_name:     { type: enum, options: [loaves, customers] }
      b_name:     { type: const, value: threshold }
      comparison: { type: enum, options: ["<", "<=", ">", ">="] }
      yes_msg:    { type: enum, options: ["اخبز كمان", "لسه في وقت"] }
      no_msg:     { type: enum, options: ["كفاية كده", "الفرن مليان"] }
    starter_template: |
      def <<fn_name>>(<<a_name>>: int, <<b_name>>: int) -> str:
          # <<brief_ar>>
          <<carried_scaffold>>
          pass
    solution_template: |
      def <<fn_name>>(<<a_name>>: int, <<b_name>>: int) -> str:
          if <<a_name>> <<comparison>> <<b_name>>:
              return "<<yes_msg>>"
          return "<<no_msg>>"
    tests:
      - input: "<<fn_name>>(<<below>>, <<threshold>>)"
        expected: '"<<yes_msg>>"'
      - input: "<<fn_name>>(<<above>>, <<threshold>>)"
        expected: '"<<no_msg>>"'

  - id: sum_a_list
    target_concept: loops
    carried_concepts: [variables]
    scenes: [bakery_gameplay]
    difficulty_band: 5
    signature: "<<fn_name>>(<<a_name>>: list) -> int"
    goal_shape: >
      Walk a list of counts and return the total.
    vocabulary_used: [orders, trays, loaves]
    param_schema:
      fn_name: { type: enum, options: [total_orders, count_all, sum_trays] }
      a_name:  { type: enum, options: [orders, trays] }
    starter_template: |
      def <<fn_name>>(<<a_name>>: list) -> int:
          # <<brief_ar>>
          <<carried_scaffold>>
          pass
    solution_template: |
      def <<fn_name>>(<<a_name>>: list) -> int:
          total = 0
          for item in <<a_name>>:
              total = total + item
          return total
    tests:
      - input: "<<fn_name>>([<<sample_list>>])"
        expected: "<<list_total>>"
      - input: "<<fn_name>>([])"
        expected: "0"

# -----------------------------------------------------------------------------
# CARRIED SCAFFOLD — how a carried concept is pre-filled when the composer decides
# a student is already strong on it. Substituted into <<carried_scaffold>> above.
# NONE means the placeholder is replaced with nothing at all.
#
# This is the mechanism that makes a loops mission about loops rather than about
# remembering how to declare a variable.
# -----------------------------------------------------------------------------
carried_scaffold:
  variables:
    FULL:    "total = 0   # جاهزة ليك"
    PARTIAL: "total =     # ابدأ من كام؟"
    NONE:    ""

# -----------------------------------------------------------------------------
# GUARDRAILS — asserted by a Python validator, never trusted to the model.
# -----------------------------------------------------------------------------
constraints:
  may_vary:
    - scene
    - params
    - brief_wording
    - npc_lines
    - carried_scaffold
    - function_name          # within the enum in param_schema, never freely
  may_not_vary:
    - world
    - target_concept
    - mechanic
    - signature_shape        # arity and types are fixed; only names vary
    - solution_shape
  locale: ar-EG
  reading_age: 10-17
  max_starter_lines: 12

  # Asserted per generated mission:
  #   - every identifier in the solution appears in vocabulary or param_schema
  #   - the solution actually passes every generated test, run in Pyodide
  #   - the starter code does NOT pass (otherwise there is nothing to do)
  #   - no test expects output the brief never asked for
  must_hold:
    - solution_passes_all_tests
    - starter_fails_at_least_one_test
    - identifiers_within_manifest
    - at_least_two_tests