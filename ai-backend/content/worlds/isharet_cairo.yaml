# =============================================================================
# WORLD MANIFEST — Isharet Cairo (traffic signals)
#
# Closed set for this world. See el_forn.yaml for what a manifest is and why the shape
# changed on 7 September 2026.
#
# Traffic control is where conditionals belong: a signal is a decision, made over and
# over, on rules a child can already picture from the street outside.
# =============================================================================

world:
  id: isharet_cairo
  name_en: "Isharet Cairo: Traffic Control"
  name_ar: إشارة القاهرة
  order: 3

  track_slug: isharet-cairo
  mentor_persona: traffic_controller

  premise_ar: >
    غرفة تحكم إشارات المرور في القاهرة. عربيات، مشاة، وطوابير بتكبر وتصغر.
    كل إشارة قرار: تفتح ولا تقفل، وعلى أي أساس.

scenes:
  - id: traffic_establishing
    asset: worlds/traffic/establishing-v1.webp
    description_en: A Cairo junction from above, signals and queued traffic
    description_ar: تقاطع في القاهرة من فوق، الإشارات والزحمة
    supports_vocabulary: [cars, taxi, minibus, tuktuk, waiting_cars, release_limit, pedestrians, people, ali, nadia, naser, mona, crossed_count, signal_state, junction, hour, is_emergency]

characters:
  - id: officer
    role: traffic_officer
    name_ar: الضابط كريم
    description: ظابط المرور اللي بينظم دور العربيات والمشاة ويشرح قواعد التقاطع
    voice: friendly, calm, practical Egyptian Arabic
    language: Egyptian Arabic for dialogue, English for code identifiers
    beats: [greeting, explain, nudge, success, celebrate]

  - id: tico
    role: mentor
    asset: characters/tico/tico-neutral.webp
    voice: warm, playful, encouraging; never sarcastic, never condescending
    language: Egyptian Arabic for dialogue, English for code identifiers
    beats: [greeting, nudge, success, failure, celebrate]

vocabulary:
  people:
    en: the people waiting for a safe crossing
    ar: قائمة المشاة المستنيين
    type: list

  ali:
    en: Ali, a pedestrian
    ar: علي
    type: str
    options: [ali]

  nadia:
    en: Nadia, a pedestrian
    ar: نادية
    type: str
    options: [nadia]

  naser:
    en: Naser, a pedestrian
    ar: ناصر
    type: str
    options: [naser]

  mona:
    en: Mona, a pedestrian
    ar: منى
    type: str
    options: [mona]

  crossed_count:
    en: number of people who crossed safely
    ar: عدد الناس اللي عدّوا
    type: int
    plausible_range: [0, 4]

  cars:
    en: the ordered list of vehicles waiting at the line
    ar: قائمة العربيات بالترتيب
    type: list

  taxi:
    en: the taxi vehicle name used inside a queue
    ar: التاكسي
    type: str
    options: [taxi]

  minibus:
    en: the minibus vehicle name used inside a queue
    ar: الميني باص
    type: str
    options: [minibus]

  tuktuk:
    en: the tuktuk vehicle name used inside a queue
    ar: التوكتوك
    type: str
    options: [tuktuk]

  waiting_cars:
    en: cars queued at the junction
    ar: العربيات المستنية
    type: int
    plausible_range: [0, 120]

  release_limit:
    en: maximum number of vehicles allowed through this cycle
    ar: أقصى عدد عربيات يعدي في الدورة
    type: int
    plausible_range: [1, 10]

  pedestrians:
    en: people waiting to cross
    ar: المشاة المستنيين
    type: int
    plausible_range: [0, 60]

  signal_state:
    en: what the light is showing
    ar: حالة الإشارة
    type: str
    options: [أحمر, أصفر, أخضر]

  hour:
    en: hour of the day, 0 to 23
    ar: الساعة
    type: int
    plausible_range: [0, 23]

  is_emergency:
    en: whether an emergency vehicle is approaching
    ar: في إسعاف جاي؟
    type: bool

  junction:
    en: which junction
    ar: التقاطع
    type: str
    options: [التحرير, رمسيس, الدقي, لبنان, الهرم, العباسية]

  wait_seconds:
    en: how long the light stays green
    ar: ثواني الانتظار
    type: int
    plausible_range: [10, 120]

# -----------------------------------------------------------------------------
# VISUAL — the closed vocabulary the client can draw and move.
#
# THE CONTRACT WITH THE FRONTEND. See el_forn.yaml for the full explanation.
# One establishing shot, no loose props: overlays only, like El Mahatta.
# -----------------------------------------------------------------------------
visual:
  backdrop: worlds/traffic/establishing-v1.webp
  establishing: worlds/traffic/establishing-v1.webp

  sprites:
    signal:     { overlay: true, states: [red, amber, green] }
    officer:    { overlay: true }
    car:        { overlay: true, countable: true, max_shown: 10 }
    pedestrian: { overlay: true, countable: true, max_shown: 8 }
    waiting_cars:        { overlay: true, countable: true, max_shown: 10 }
    cars_visible:        { overlay: true, countable: true, max_shown: 5 }
    cars_passed:         { overlay: true, countable: true, max_shown: 10 }
    car_move_from:       { overlay: true, countable: true, max_shown: 5 }
    waiting_pedestrians: { overlay: true, countable: true, max_shown: 4 }
    pedestrians_crossed: { overlay: true, countable: true, max_shown: 4 }
    timer_seconds:       { overlay: true }
    timer_for:           { overlay: true }

  states:
    signal: [red, amber, green]

  animations:
    - car_arrive          # one vehicle approaches and stops before the line
    - cars_arrive         # a larger queue forms for the remix
    - signal_countdown    # the five-second timer counts down
    - signal_switch       # the light changes colour
    - cars_move           # queued cars pull away one by one
    - pedestrians_cross   # the waiting group crosses after cars stop
    - pedestrians_arrive  # legacy state change; the next group now appears on the pavement instantly
    - officer_point       # Karim directs attention to the active side
    - celebrate           # Karim acknowledges a safe completed cycle

  # These are the two scene elements wired as buttons by TrafficScene.
  interactive_targets: [signal, officer]

mechanics:
  - id: cross_each_pedestrian
    target_concept: loops
    carried_concepts: [conditionals, variables]
    scenes: [traffic_establishing]
    difficulty_band: 3
    signature: "people and crossed_count (top-level Python, no function)"
    goal_shape: >
      Count the two people who can cross after traffic stops, one at a time.
    vocabulary_used: [people, ali, nadia, naser, mona, crossed_count]
    starter_template: |
      people = ["ali", "nadia"]
      crossed_count = 0
      for person in people:
          pass
    solution_template: |
      people = ["ali", "nadia"]
      crossed_count = 0
      for person in people:
          crossed_count = crossed_count + 1
    tests:
      - input: 'len(people)'
        expected: "2"
      - input: "crossed_count"
        expected: "2"
    remix_goal: >
      Two more people join the pavement. Change the people list to four entries;
      the same loop counts each safe crossing.
    remix_solution_template: |
      people = ["ali", "nadia", "mona", "naser"]
      crossed_count = 0
      for person in people:
          crossed_count = crossed_count + 1
    remix_tests:
      - input: 'len(people)'
        expected: "4"
      - input: "crossed_count"
        expected: "4"

  - id: release_each_car
    target_concept: loops
    carried_concepts: [conditionals, variables]
    scenes: [traffic_establishing]
    difficulty_band: 3
    signature: "cars and released_count (top-level Python, no function)"
    goal_shape: >
      Walk through a short queue one car at a time and return how many cars were released.
    vocabulary_used: [waiting_cars]
    starter_template: |
      cars = ["taxi", "minibus", "tuktuk"]
      released_count = 0
      for car in cars:
          pass
    solution_template: |
      cars = ["taxi", "minibus", "tuktuk"]
      released_count = 0
      for car in cars:
          released_count = released_count + 1
    tests:
      - input: 'len(cars)'
        expected: "3"
      - input: "released_count"
        expected: "3"
    remix_goal: >
      Two more cars join the queue. Change only the cars list to five entries; the same
      loop releases them one by one without a new function or condition.
    remix_solution_template: |
      cars = ["taxi", "minibus", "tuktuk", "taxi", "minibus"]
      released_count = 0
      for car in cars:
          released_count = released_count + 1
    remix_tests:
      - input: 'len(cars)'
        expected: "5"
      - input: 'released_count'
        expected: "5"

  - id: release_regular_cars
    target_concept: loops
    carried_concepts: [conditionals, variables]
    scenes: [traffic_establishing]
    difficulty_band: 5
    signature: "cars, release_limit, released_count (top-level Python)"
    goal_shape: >
      Walk through a queue but release no more than a fixed safe limit.
    vocabulary_used: [waiting_cars, release_limit]
    starter_template: |
      cars = ["taxi", "minibus", "tuktuk"]
      release_limit = 2
      released_count = 0
      for car in cars:
          pass
    solution_template: |
      cars = ["taxi", "minibus", "tuktuk"]
      release_limit = 2
      released_count = 0
      for car in cars:
          if released_count < release_limit:
              released_count = released_count + 1
    tests:
      - input: 'released_count'
        expected: "2"
      - input: 'len(cars)'
        expected: "3"

  - id: two_way_rule
    target_concept: conditionals
    carried_concepts: [variables]
    scenes: [traffic_establishing]
    difficulty_band: 3
    signature: "<<fn_name>>(<<a_name>>: int, <<b_name>>: int) -> str"
    # Modelled on the signal-rules lesson that already exists.
    goal_shape: >
      Return one of two signal states depending on how two counts compare.
    vocabulary_used: [waiting_cars, pedestrians, signal_state]
    param_schema:
      fn_name:    { type: enum, options: [signal_for, decide_signal, next_state] }
      a_name:     { type: const, value: waiting_cars }
      b_name:     { type: const, value: pedestrians }
      comparison: { type: enum, options: [">", ">=", "<", "<="] }
      yes_state:  { type: enum, options: [أخضر, أحمر] }
      no_state:   { type: enum, options: [أحمر, أخضر] }
    starter_template: |
      def <<fn_name>>(<<a_name>>: int, <<b_name>>: int) -> str:
          # <<brief_ar>>
          <<carried_scaffold>>
          pass
    solution_template: |
      def <<fn_name>>(<<a_name>>: int, <<b_name>>: int) -> str:
          if <<a_name>> <<comparison>> <<b_name>>:
              return "<<yes_state>>"
          return "<<no_state>>"
    tests:
      - input: "<<fn_name>>(<<sample_a>>, <<sample_b>>)"
        expected: '"<<yes_state>>"'
      - input: "<<fn_name>>(<<sample_a2>>, <<sample_b2>>)"
        expected: '"<<no_state>>"'

  - id: priority_override
    target_concept: conditionals
    carried_concepts: [variables]
    scenes: [traffic_establishing]
    difficulty_band: 5
    signature: "<<fn_name>>(<<a_name>>: int, <<b_name>>: bool) -> str"
    goal_shape: >
      One condition overrides another. An emergency wins regardless of the count.
    vocabulary_used: [waiting_cars, is_emergency, signal_state]
    param_schema:
      fn_name:   { type: enum, options: [signal_with_priority, emergency_signal] }
      a_name:    { type: const, value: waiting_cars }
      b_name:    { type: const, value: is_emergency }
      threshold: { type: int, min: 5, max: 40 }
    starter_template: |
      def <<fn_name>>(<<a_name>>: int, <<b_name>>: bool) -> str:
          # <<brief_ar>>
          <<carried_scaffold>>
          pass
    solution_template: |
      def <<fn_name>>(<<a_name>>: int, <<b_name>>: bool) -> str:
          if <<b_name>>:
              return "أخضر"
          if <<a_name>> > <<threshold>>:
              return "أخضر"
          return "أحمر"
    tests:
      - input: "<<fn_name>>(0, True)"
        expected: '"أخضر"'
      - input: "<<fn_name>>(<<above>>, False)"
        expected: '"أخضر"'
      - input: "<<fn_name>>(<<below>>, False)"
        expected: '"أحمر"'

  - id: time_window
    target_concept: conditionals
    carried_concepts: [variables]
    scenes: [traffic_establishing]
    difficulty_band: 5
    signature: "<<fn_name>>(<<a_name>>: int) -> str"
    goal_shape: >
      Decide from a value falling inside or outside a range.
    vocabulary_used: [hour, signal_state]
    param_schema:
      fn_name:    { type: enum, options: [night_mode, signal_by_hour] }
      a_name:     { type: const, value: hour }
      start_hour: { type: int, min: 22, max: 23 }
      end_hour:   { type: int, min: 4, max: 6 }
    starter_template: |
      def <<fn_name>>(<<a_name>>: int) -> str:
          # <<brief_ar>>
          pass
    solution_template: |
      def <<fn_name>>(<<a_name>>: int) -> str:
          if <<a_name>> >= <<start_hour>> or <<a_name>> <= <<end_hour>>:
              return "أصفر"
          return "أخضر"
    tests:
      - input: "<<fn_name>>(<<night_sample>>)"
        expected: '"أصفر"'
      - input: "<<fn_name>>(<<day_sample>>)"
        expected: '"أخضر"'

  - id: cycle_junctions
    target_concept: loops
    carried_concepts: [conditionals, variables]
    scenes: [traffic_establishing]
    difficulty_band: 7
    signature: "counts, threshold, busy (top-level Python)"
    goal_shape: >
      Walk a list of junctions and count how many need attention.
    vocabulary_used: [junction, waiting_cars]
    starter_template: |
      counts = [2, 5, 1]
      threshold = 3
      busy = 0
      for count in counts:
          pass
    solution_template: |
      counts = [2, 5, 1]
      threshold = 3
      busy = 0
      for count in counts:
          if count > threshold:
              busy = busy + 1
    tests:
      - input: 'busy'
        expected: "1"
      - input: 'len(counts)'
        expected: "3"

  - id: reusable_signal_check
    target_concept: functions
    carried_concepts: [conditionals, variables]
    scenes: [traffic_establishing]
    difficulty_band: 7
    signature: "<<fn_name>>(waiting_cars: int, is_emergency: bool) -> str"
    goal_shape: >
      Package the traffic priority rule inside a named function that can be called again
      for any queue.
    vocabulary_used: [waiting_cars, is_emergency, signal_state]
    param_schema:
      fn_name: { type: enum, options: [choose_signal, traffic_decision] }
    starter_template: |
      def <<fn_name>>(waiting_cars: int, is_emergency: bool) -> str:
          # <<brief_ar>>
          <<carried_scaffold>>
          pass
    solution_template: |
      def <<fn_name>>(waiting_cars: int, is_emergency: bool) -> str:
          if is_emergency or waiting_cars >= 3:
              return "أخضر"
          return "أحمر"
    tests:
      - input: "<<fn_name>>(0, True)"
        expected: '"أخضر"'
      - input: "<<fn_name>>(3, False)"
        expected: '"أخضر"'
      - input: "<<fn_name>>(1, False)"
        expected: '"أحمر"'

carried_scaffold:
  variables:
    FULL:    "# القيم جاهزة ليك في البارامترات"
    PARTIAL: "# فاضل تسمي المتغير اللي هتحتاجه"
    NONE:    ""
  conditionals:
    FULL:    "# الشرط الأول مكتوب لك"
    PARTIAL: "# فاضل تكمل الشرط التاني"
    NONE:    ""

constraints:
  may_vary:
    - scene
    - params
    - brief_wording
    - npc_lines
    - carried_scaffold
    - function_name
  may_not_vary:
    - world
    - target_concept
    - mechanic
    - signature_shape
    - solution_shape
  locale: ar-EG
  reading_age: 10-17
  max_starter_lines: 12

  must_hold:
    - solution_passes_all_tests
    - starter_fails_at_least_one_test
    - identifiers_within_manifest
    - at_least_two_tests

  # Arabic string returns are compared literally by Pyodide, so a generated mission
  # must use the exact forms in vocabulary.signal_state — "اخضر" without the hamza
  # would fail a test the student cannot see.
  exact_strings:
    - signal_state
